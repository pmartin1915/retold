name: Build & Test

on:
  # PRs only. A push to main re-tested the exact tree its PR had just passed (squash merge),
  # so it was a duplicate run. Code reaches main only through a green PR; docs/state commits
  # go straight to main and compile nothing. workflow_dispatch covers a manual main check.
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'ai/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# A stacked push cancels the run it superseded (macOS minutes bill at 10x if a repo is private).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & XCTest (iOS Simulator)
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One Xcode for the whole job. Every later step inherits DEVELOPER_DIR, so the build
      # cannot disagree with itself about which toolchain it means.
      - name: Select Xcode
        run: |
          # Newest RELEASE Xcode, never a beta that happens to sort higher (see select-xcode.sh).
          source .github/scripts/select-xcode.sh
          sudo xcode-select -s "$RELEASE_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$RELEASE_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using: $RELEASE_XCODE"
          DEVELOPER_DIR="$RELEASE_XCODE/Contents/Developer" xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          XCODEGEN_BIN=$(find /tmp/xcodegen -name "xcodegen" -type f | head -1)
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Retold.xcodeproj \
            -scheme Retold \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/test.xcresult" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Debug-only CI can't see Release-only breakage (e.g. a non-DEBUG caller of a
      # #if DEBUG test double). Unsigned Release compile with the allowlisted Xcode.
      - name: Release compile (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Retold.xcodeproj \
            -scheme Retold \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_number }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
