name: Deploy to App Store

# Do NOT rename this file: github.run_number is per-workflow and a rename restarts it at 1.
# Never re-run a deploy past the upload step; run_attempt in the build number is the
# backstop, not a licence.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-app-store
  cancel-in-progress: false

jobs:
  deploy:
    name: Archive, verify, upload
    runs-on: xcode-27

    env:
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then echo "No Xcode found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using: $XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          XCODEGEN_BIN=$(find /tmp/xcodegen -name "xcodegen" -type f | head -1)
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple Distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          APP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"${APP_UUID}".mobileprovision
          rm -f "$RUNNER_TEMP/app.mobileprovision"
          echo "Installed profile $APP_UUID"

      - name: Setup App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Retold.xcodeproj \
            -scheme Retold \
            -archivePath "$RUNNER_TEMP/Retold.xcarchive" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            ARCHS=arm64 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify

      # manageAppVersionAndBuildNumber defaults to YES, which lets export re-derive the
      # version from project settings and silently discard the CURRENT_PROJECT_VERSION
      # override. That is what shipped Wilderness 1.7.0 with the wrong build number.
      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.pmartin1915.retold</key>
              <string>Retold AppStore</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Retold.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export/"

      # Reads the number back from the artifact that ships, not the archive. This proves
      # packaging only: it cannot tell whether App Store Connect already has this number.
      - name: Verify build number in exported .ipa
        run: |
          IPA_FILE=$(find "$RUNNER_TEMP/export" -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then echo "No .ipa exported"; exit 1; fi
          VERIFY_DIR=$RUNNER_TEMP/ipa-verify
          rm -rf "$VERIFY_DIR"
          unzip -q "$IPA_FILE" -d "$VERIFY_DIR"
          IPA_PLIST=$(find "$VERIFY_DIR/Payload" -maxdepth 2 -name "Info.plist" | head -1)
          if [ -z "$IPA_PLIST" ]; then echo "Info.plist not found inside .ipa"; exit 1; fi
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IPA_PLIST")
          ACTUAL_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$IPA_PLIST")
          echo "Shipped CFBundleShortVersionString: $ACTUAL_SHORT"
          echo "Shipped CFBundleVersion:            $ACTUAL_BUILD (expected $BUILD_NUMBER)"
          if [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "Export discarded the build number override; refusing to upload."
            exit 1
          fi
          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: retold-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.IPA_FILE }}
          retention-days: 30

      - name: Upload to App Store Connect
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -rf ~/private_keys
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles
