name: Retold

options:
  bundleIdPrefix: dev.pmartin1915
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: NN8F5WX25R
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      # A hand-authored XcodeGen project does not get Xcode's project-template default of
      # SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG for free -- StoryCue hit this the first
      # week a file used #if DEBUG (run 35694706946); set it explicitly up front instead of
      # rediscovering the same bug here.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Retold:
    type: application
    platform: iOS
    sources:
      - Retold
    dependencies:
      # The Action-button / Control Center control (R6 spec section 8). Embedded under PlugIns.
      - target: RetoldControls
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.retold
        PRODUCT_NAME: Retold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. XcodeGen's iOS preset is "1,2" (universal), which would make iPad
        # screenshots mandatory in ASC and ship an iPad layout nothing has tested.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Retold AppStore"
    info:
      path: Retold/Info.plist
      properties:
        CFBundleDisplayName: Retold
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Retold records your voice while you talk through a memory. Recordings stay on this phone."
        NSSpeechRecognitionUsageDescription: "Turns your recording into text on this iPhone."

  RetoldControls:
    type: app-extension
    platform: iOS
    sources:
      - RetoldControls
      # StartCaptureIntent must be a member of both targets to open the app (R6 spec section 5.3).
      - Retold/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.retold.controls
        PRODUCT_NAME: RetoldControls
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Retold Controls AppStore"
    info:
      # Generated by XcodeGen; the version keys must equal the app's or App Store Connect rejects the build.
      path: RetoldControls/Info.plist
      properties:
        CFBundleDisplayName: Retold
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  RetoldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RetoldTests
    dependencies:
      - target: Retold
    settings:
      base:
        PRODUCT_NAME: RetoldTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.retold.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Retold.app/Retold
        BUNDLE_LOADER: $(TEST_HOST)
    info:
      path: RetoldTests/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

schemes:
  Retold:
    build:
      targets:
        Retold: all
    test:
      targets:
        - RetoldTests
    run:
      config: Debug
    archive:
      config: Release
