name: Retold

options:
  bundleIdPrefix: dev.pmartin1915
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: NN8F5WX25R
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      # A hand-authored XcodeGen project does not get Xcode's project-template default of
      # SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG for free -- StoryCue hit this the first
      # week a file used #if DEBUG (run 35694706946); set it explicitly up front instead of
      # rediscovering the same bug here.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Retold:
    type: application
    platform: iOS
    sources:
      - Retold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.retold
        PRODUCT_NAME: Retold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Retold AppStore"
    info:
      path: Retold/Info.plist
      properties:
        CFBundleDisplayName: Retold
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Retold records your voice while you talk through a memory. Recordings stay on this phone."

  RetoldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RetoldTests
    dependencies:
      - target: Retold
    settings:
      base:
        PRODUCT_NAME: RetoldTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.retold.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Retold.app/Retold
        BUNDLE_LOADER: $(TEST_HOST)
    info:
      path: RetoldTests/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

schemes:
  Retold:
    build:
      targets:
        Retold: all
    test:
      targets:
        - RetoldTests
    run:
      config: Debug
    archive:
      config: Release
