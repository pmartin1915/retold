name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# macOS minutes bill at 10x on a private repo; a stacked push cancels the run it superseded.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & XCTest (iOS Simulator)
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One Xcode for the whole job. Every later step inherits DEVELOPER_DIR, so the build
      # cannot disagree with itself about which toolchain it means.
      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then echo "No Xcode found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using: $XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          XCODEGEN_BIN=$(find /tmp/xcodegen -name "xcodegen" -type f | head -1)
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Retold.xcodeproj \
            -scheme Retold \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/test.xcresult" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_number }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
